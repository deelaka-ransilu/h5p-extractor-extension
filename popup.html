<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 360px; padding: 16px; }</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="icons/icon48.png" alt=""> H5P Weekly Extractor</div>
    <button class="icon-btn" id="openLibBtn" title="Open the full library in a new tab"></button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tabPage" role="tab">This page</button>
    <button class="tab" id="tabLib" role="tab">Library <span data-lib-count></span></button>
  </div>

  <div id="viewPage">
    <div class="panel">
      <div style="display:flex;align-items:center;gap:8px"><span class="dot" id="dot"></span><p id="title" style="flex:1">Checking this page…</p></div>
      <p id="meta"></p>
      <button class="btn primary wide" id="bothBtn" style="margin-top:12px;padding:10px 12px;font-size:14px" disabled>Download notes + slides</button>
      <div class="row-btns">
        <button class="btn" id="txtBtn" disabled>Notes .txt</button>
        <button class="btn" id="pdfBtn" disabled>Slides .pdf</button>
      </div>
      <div class="row-btns">
        <button class="btn" id="addBtn" disabled>Add to library</button>
      </div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="autoCard">
      Show the download card on H5P pages
    </label>
  </div>

  <div id="viewLib" hidden>
    <div class="panel">
      <div id="libList"></div>
      <button class="btn primary wide" id="zipSelBtn" style="margin-top:12px" disabled>Download selected (0)</button>
      <div class="row-btns">
        <button class="btn" id="zipAllBtn" disabled>Download all</button>
        <button class="btn" id="rmSelBtn" disabled>Remove selected (0)</button>
      </div>
    </div>
  </div>

  <pre id="log" hidden></pre>
  <script src="icons.js"></script>
  <script src="library-db.js"></script>
  <script src="library-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
